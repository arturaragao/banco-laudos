<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F5C4D">
<title>Banco de laudos</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root{--verde:#0F5C4D;--fundo:#EEF1F6;--texto:#202124;--suave:#5F6368;--borda:#DADCE0;--cartao:#fff;--campo:#fff;--leve:#F3F5F8;--acc:#E6F2EF}
  @media (prefers-color-scheme:dark){:root{--fundo:#15181C;--texto:#E8EAED;--suave:#9AA0A6;--borda:#3C4043;--cartao:#202428;--campo:#2A2F34;--leve:#2A2F34;--acc:#173B33}}
  *{box-sizing:border-box}
  body{font-family:"Segoe UI",system-ui,sans-serif;background:var(--fundo);color:var(--texto);margin:0;-webkit-text-size-adjust:100%}
  header{background:var(--verde);color:#fff;padding:12px 16px calc(10px);padding-top:max(12px,env(safe-area-inset-top));position:sticky;top:0;z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.2)}
  header h1{margin:0;font-size:18px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
  header h1 small{font-weight:400;font-size:12.5px;color:#BFE3DA}
  .filtros{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-top:10px}
  .filtros2{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;margin-top:8px;align-items:end}
  .rot{font-size:11px;color:#BFE3DA;margin-bottom:2px}
  input,select{width:100%;border:1px solid #C5CBD3;border-radius:7px;padding:7px 8px;font-size:14px;font-family:inherit;background:var(--campo);color:var(--texto)}
  button{border:1px solid #C5CBD3;background:var(--cartao);border-radius:7px;padding:7px 12px;font-size:13px;cursor:pointer;color:var(--texto);white-space:nowrap;font-family:inherit}
  button:hover{background:var(--leve)}
  .barra{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
  .barra .info{font-size:12.5px;color:#E0F2EE;margin-left:auto}
  #bNuvem.alerta{background:#FFF4CE;color:#5C4400;border-color:#E3B341}
  #bFiltros{display:none}
  main{max-width:980px;margin:14px auto;padding:0 12px 80px}
  .vazio{background:var(--cartao);border-radius:10px;padding:24px;text-align:center;color:var(--suave);line-height:1.5}
  .item{background:var(--cartao);border-radius:10px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);border-left:4px solid var(--verde)}
  .item.normal{border-left-color:#9AA0A6}
  .cab{font-size:14.5px;font-weight:600;line-height:1.35;cursor:pointer;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  .acc{font-family:Consolas,monospace;background:var(--acc);color:var(--verde);padding:1px 6px;border-radius:5px;user-select:all}
  @media (prefers-color-scheme:dark){.acc{color:#8FD3C2}}
  .data{color:var(--suave);font-weight:400}
  .sub{font-size:12.5px;color:var(--suave);margin-top:3px}
  .resumo{font-size:13.5px;font-weight:600;margin-top:6px}
  .conc[contenteditable]{outline:none;border-radius:6px;padding-top:2px;padding-bottom:2px;cursor:text}
  .conc[contenteditable]:focus{box-shadow:0 0 0 2px #0F5C4D55}
  .conc:empty::before{content:"Conclusão — toque para escrever";color:#9AA0A6}
  .resumo[contenteditable]{outline:none;border-radius:6px;cursor:text}
  .resumo[contenteditable]:focus{box-shadow:0 0 0 2px #0F5C4D55}
  .conc{font-size:13.5px;margin:4px 0 0;padding-left:20px;line-height:1.45}
  .laudo ol{margin:0 0 6px;padding-left:22px}
  .laudo{margin-top:10px;border-top:1px solid var(--borda);padding-top:10px;font-size:14px;line-height:1.55}
  .laudo p{margin:0 0 6px}
  .imgs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .imgs img{max-height:320px;max-width:100%;border-radius:6px;background:#000;cursor:zoom-in}
  .imgs .carregando{width:120px;height:120px;border-radius:6px;background:var(--leve);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--suave)}
  .acoes{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:flex-end}
  .acoes button{padding:6px 10px;font-size:12.5px}
  .laudo.editando{outline:2px solid var(--verde);border-radius:6px;padding:10px}
  .rotres{font-size:11.5px;color:var(--suave);flex:1 1 100%;display:block}
  .rotres input{margin-top:3px}
  .mais{display:block;margin:10px auto}
  .lixo{margin-left:auto;border:none;background:none;padding:0 4px;font-size:14px;opacity:.45}
  .lixo:hover{opacity:1;background:none}
  #zoom{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:9;overflow:auto}
  #zoom img{max-width:100vw;max-height:100vh;touch-action:pinch-zoom}
  #fmt{position:fixed;left:0;right:0;bottom:0;display:none;gap:8px;justify-content:center;padding:8px;padding-bottom:max(8px,env(safe-area-inset-bottom));background:var(--cartao);border-top:1px solid var(--borda);z-index:5}
  #fmt button{min-width:48px;font-size:15px}
  dialog{border:none;border-radius:12px;max-width:520px;width:calc(100% - 24px);background:var(--cartao);color:var(--texto);padding:18px}
  dialog::backdrop{background:rgba(0,0,0,.45)}
  dialog h2{margin:0 0 10px;font-size:17px}
  dialog label{display:block;margin:12px 0 4px;font-size:13px}
  dialog small{color:var(--suave);font-size:12px;line-height:1.45;display:block;margin-top:4px}
  .check{display:flex;gap:8px;align-items:center}
  .check input{width:auto}
  .linha{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  #estado{font-size:13px;line-height:1.5;background:var(--leve);border-radius:8px;padding:10px;margin-top:6px}
  @media (max-width:720px){
    .filtros{grid-template-columns:1fr}
    .filtros .medexame{display:none}
    .filtros2{display:none;grid-template-columns:1fr 1fr}
    header.abertos .filtros .medexame,header.abertos .filtros2{display:grid}
    header.abertos .filtros .medexame{display:block}
    #bFiltros{display:inline-block}
    .barra .secundario{display:none}
    .barra .info{flex:1 1 100%;margin-left:0}
  }
</style>
</head>
<body>
<header id="topo">
  <h1>Banco de laudos <small id="resumo">carregando…</small></h1>
  <div class="filtros">
    <div><div class="rot">Achados / texto do laudo</div><input id="fTexto" type="search" placeholder="nodulo pulmonar; esteatose -leve; &quot;lesao expansiva&quot;"></div>
    <div class="medexame"><div class="rot">Exame</div><input id="fExame" placeholder="tc torax"></div>
    <div class="medexame"><div class="rot">Médico</div><input id="fMedico" list="listaMedicos" placeholder="toque para escolher"><datalist id="listaMedicos"></datalist></div>
  </div>
  <div class="filtros2">
    <div><div class="rot">De</div><input id="fDe" type="date"></div>
    <div><div class="rot">Até</div><input id="fAte" type="date"></div>
    <div><div class="rot">Laudos</div><select id="fNormal"><option value="">todos</option><option value="alt">só com alteração</option><option value="normal">só 100% normais</option></select></div>
    <button id="bLimpar">Limpar</button>
  </div>
  <div class="barra">
    <button id="bFiltros">Filtros</button>
    <button id="bNuvem" title="Traz o que mudou nos outros aparelhos e envia o que mudou aqui (Google Drive e, neste PC, a extensão)">⇅ Sincronizar</button>
    <button id="bRefazer" class="secundario" title="Refaz o resumo de todos os laudos com as regras atuais">Refazer resumos</button>
    <button id="bApagarFiltrados" class="secundario" title="Apaga todos os laudos da busca atual (de todos os aparelhos)">🗑 Apagar os filtrados</button>
    <button id="bOpcoes" aria-label="Configurações">⚙</button>
    <span class="info" id="msg"></span>
  </div>
</header>
<main>
  <section id="lista"><div class="vazio">Carregando…</div></section>
</main>
<div id="zoom"><img alt=""></div>
<div id="fmt"><button data-fmt="bold"><b>N</b></button><button data-fmt="italic"><i>I</i></button><button data-fmt="underline"><u>S</u></button></div>

<dialog id="dOpcoes">
  <h2>Configurações</h2>
  <div id="estado">…</div>
  <div class="linha">
    <button id="oConectar">Conectar ao Google Drive</button>
    <button id="oDesconectar">Desconectar</button>
  </div>
  <label class="check"><input id="oResumo" type="checkbox"> Mostrar o resumo nos cartões</label>
  <small>Desligado: só a conclusão, com as palavras importantes em negrito e sublinhado.</small>
  <label for="oCliente">ID do cliente OAuth do Google</label>
  <input id="oCliente" placeholder="123…apps.googleusercontent.com">
  <small>Só se o app pedir. O normal é já vir no app (config.js).</small>
  <div class="linha">
    <button id="oRefazer">Refazer resumos</button>
    <button id="oApagar">🗑 Apagar os filtrados</button>
    <a id="oNotion" href="https://www.notion.so/3e991fa845d880268d64d80cdbff8515" target="_blank" rel="noopener"><button type="button">Notas Tomografia ↗</button></a>
  </div>
  <div class="linha"><button id="oFechar" style="margin-left:auto">Fechar</button></div>
</dialog>
<script type="module" src="app.js"></script>
</body>
</html>
